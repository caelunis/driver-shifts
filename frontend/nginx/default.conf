# Serves the built app and proxies /api to the backend: one origin, so the session
# cookie stays SameSite=Lax and no CORS is needed.
# One JSON object per line; request_id is the same id the backend logs (X-Request-ID)
log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","request_id":"$request_id",'
    '"client":"$remote_addr","method":"$request_method","path":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    access_log /dev/stdout json;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://app:8000;
        # nginx's own id for this request, so its log line and the backend's share it
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Hashed file names: cache forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all get index.html, which is never cached so a release shows up at once
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
