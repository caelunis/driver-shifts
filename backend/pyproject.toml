[project]
name = "driver-shifts-backend"
version = "2.0.0"
description = "Driver shift diary: API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "tzdata>=2025.2",
    # ASGI server written in Rust
    "granian>=2.5",
    # JSON for bodies built by hand (errors, cache entries)
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
    "pre-commit>=4.3",
]

[tool.uv]
# An application, not a library: nothing to build or publish
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    # starlette.testclient on top of httpx: a notice for the library, not for this code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "N",        # naming
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "TID",      # tidy imports: no relative imports
    "RUF",      # ruff's own rules
    "ASYNC",    # blocking calls in async code
    "S",        # bandit security checks
    "PLR2004",  # magic numbers in comparisons
]
ignore = [
    "S608",     # SQL built from fixed fragments; values always go as parameters
    "RUF001",   # Cyrillic text is intended (messages, plate look-alikes)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's way of declaring dependencies and parameters
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Cookie", "fastapi.Path"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is what tests do
    "S105", "S106", "S107",  # passwords in tests are test data
    "S603", "S607",  # tests run dbmate and scripts as subprocesses
    "PLR2004",  # expected values in assertions
]
"scripts/**" = ["S603", "S607"]
"scripts/seed_demo.py" = ["S106"]  # demo credentials are public on purpose (README)

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
# Basic checking for now; strict mode comes with the class-based layers (step 3 of v3)
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
