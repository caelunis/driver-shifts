# Database credentials come from .env (copy .env.example); there are no built-in defaults
x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

# How the backend containers reach the database: inside the compose network
x-app-database-env: &app-database-env
  <<: *database-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:16-alpine
    environment:
      <<: *database-env
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-shifts_test}
    ports:
      # For local development and tests only; bound to localhost
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start of an empty volume: creates the test database
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Cache and shared rate-limit counters. The app keeps working without it
  # (in-process fallback), so nothing waits for it to be healthy.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      # For local development and tests only; bound to localhost
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies backend/db/migrations; the app itself never changes the schema
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./backend/db:/db:ro
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  # One-off start-up tasks: demo accounts, first admin (scripts/bootstrap.py)
  bootstrap:
    build: ./backend
    environment:
      <<: *app-database-env
      SEED_DEMO: ${SEED_DEMO:-1}
      LOG_FORMAT: json
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: ./backend
    environment:
      <<: *app-database-env
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GRANIAN_WORKERS: ${GRANIAN_WORKERS:-2}
    # Not published: reached through `web`, which serves the frontend on the same origin
    expose:
      - "8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # The React app (frontend/), served by nginx, which also proxies /api to `app`
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
